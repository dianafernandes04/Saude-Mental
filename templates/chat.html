<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - Sistema de Apoio à Saúde Mental</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <header>
        <img id="logo" src="static/images/yourmind-logo.png" alt="Logo">
        <h1>Sistema de Apoio à Saúde Mental</h1>
        <div class="header-actions">
            <button id="music-toggle">
                <i data-lucide="music"></i>
            </button>
            <button id="theme-toggle">
                <i data-lucide="moon"></i>
            </button>
            <button id="menu-toggle">
                <i data-lucide="menu"></i>
            </button>
            <button id="profile-btn">
                <i data-lucide="user"></i>
            </button>
        </div>
        <div id="menu-dropdown" style="display:none; position:absolute; top:60px; right:20px; background:#f9f9fb; color:#475866; border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,0.10); min-width:220px; z-index:1000; font-family:'Poppins',sans-serif; font-weight:500; font-size:0.88em; padding:0; border:none;">
            <div class="menu-item" id="minijogos-link" style="padding:12px 22px; cursor:pointer; color:#475866; border-radius:10px; transition:background 0.2s; font-weight:500; font-size:0.88em;">
                Mini-Jogos de Relaxamento
            </div>
            <div class="menu-item" id="calendario-link" style="padding:12px 22px; cursor:pointer; color:#475866; border-radius:10px; transition:background 0.2s; font-weight:500; font-size:0.88em;">
                Calendário de Emoções
            </div>
        </div>
        <!-- Modal de Perfil -->
        <div id="profile-modal-overlay"></div>
        <div id="profile-modal">
            <h2>Perfil do Utilizador</h2>
            <label for="profile-name">Nome:</label>
            <input id="profile-name" type="text">
            <div style="margin-bottom:16px;">Escolhe o teu avatar:</div>
            <div id="avatar-list">
                <img src="static/avatars/avatar1.png" class="avatar-option" data-avatar="avatar1.png">
                <img src="static/avatars/avatar2.png" class="avatar-option" data-avatar="avatar2.png">
                <img src="static/avatars/avatar3.png" class="avatar-option" data-avatar="avatar3.png">
                <img src="static/avatars/avatar4.png" class="avatar-option" data-avatar="avatar4.png">
                <img src="static/avatars/avatar5.png" class="avatar-option" data-avatar="avatar5.png">
                <img src="static/avatars/avatar6.png" class="avatar-option" data-avatar="avatar6.png">
            </div>
            <button id="save-profile-btn" class="button-auth">Guardar</button>
        </div>
    </header>

    <main>
        <div class="layout">
            <div class="historico-lateral">
                <div class="container">
                    <button id="anon-mode-btn" class="button-auth" style="margin-bottom: 15px; background: #333; color: #fff;">Modo Anónimo</button>
                    <h2>Histórico</h2>
                    <button id="nova-conversa-btn" class="button-auth">Nova Conversa</button>
                    <button id="apagar-historico-btn" class="button-auth" style="background:#c0392b; color:#fff; margin-bottom:10px;">Apagar Histórico</button>
                    <div id="historico-lista"></div>
                    <button id="logout-btn">Sair</button>
                </div>
            </div>

            <div class="conteudo-central">
                <div id="chat-container">
                    <div id="chat-messages"></div>
                    <div class="input-group">
                        <input type="text" id="message-input" placeholder="Escreve a tua mensagem...">
                        <button id="mic-btn" type="button"><i data-lucide="mic"></i></button>
                        <button id="send-btn">
                            <i data-lucide="send"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Audio Element -->
    <audio id="background-music" loop>
        <source src="static/musica/relaxante.mp3" type="audio/mpeg">
    </audio>

    <!-- JavaScript -->
    <script src="static/common.js"></script>
    <script src="static/chat.js"></script>
    <script>
    document.getElementById('logo').onclick = function() {
        window.location.href = '/';
    };
    // Menu dropdown
    const menuToggle = document.getElementById('menu-toggle');
    const menuDropdown = document.getElementById('menu-dropdown');
    menuToggle.onclick = function(e) {
        e.stopPropagation();
        menuDropdown.style.display = menuDropdown.style.display === 'block' ? 'none' : 'block';
    };
    document.getElementById('minijogos-link').onclick = function() {
        window.location.href = '/minijogos';
    };
    document.body.addEventListener('click', function() {
        menuDropdown.style.display = 'none';
    });
    // Hover effect para o menu
    document.getElementById('minijogos-link').onmouseover = function() {
        this.style.background = '#eaf6fa';
    };
    document.getElementById('minijogos-link').onmouseout = function() {
        this.style.background = 'none';
    };
    // Hover effect para o calendário
    document.getElementById('calendario-link').onmouseover = function() {
        this.style.background = '#eaf6fa';
    };
    document.getElementById('calendario-link').onmouseout = function() {
        this.style.background = 'none';
    };
    // Navegação para o calendário
    document.getElementById('calendario-link').onclick = function() {
        window.location.href = '/calendario';
    };

    // Função para carregar e exibir uma conversa específica
    async function carregarConversaEspecifica(sessaoId) {
        try {
            const token = localStorage.getItem('token');
            if (!token) return;

            // Buscar as mensagens da sessão
            const response = await fetch(`/api/historico/${sessaoId}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!response.ok) {
                throw new Error('Erro ao carregar conversa');
            }

            const mensagens = await response.json();
            const chatMessages = document.getElementById('chat-messages');
            
            // Limpar mensagens anteriores
            chatMessages.innerHTML = '';
            
            // Atualizar sessão atual
            window.sessaoAtual = sessaoId;
            
            // Destacar a conversa no histórico
            const historicoItems = document.querySelectorAll('.historico-item');
            historicoItems.forEach(item => {
                if (item.dataset.sessaoId === sessaoId) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            // Exibir as mensagens
            mensagens.forEach(msg => {
                // Mensagem do usuário
                const userDiv = document.createElement('div');
                userDiv.className = 'message user-message';
                userDiv.innerHTML = `<p>${msg.mensagem}</p>`;
                chatMessages.appendChild(userDiv);

                // Resposta do assistente
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                botDiv.innerHTML = `<p>${msg.resposta}</p>`;
                chatMessages.appendChild(botDiv);
            });

            // Rolar para o final da conversa
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
        } catch (error) {
            console.error('Erro ao carregar conversa:', error);
        }
    }

    // Verificar se veio do calendário e carregar a sessão específica
    window.addEventListener('DOMContentLoaded', async () => {
        const ultimaSessao = localStorage.getItem('ultima_sessao');
        if (ultimaSessao) {
            // Limpar o storage para não interferir em futuras navegações
            localStorage.removeItem('ultima_sessao');
            
            // Esperar um momento para garantir que o histórico foi carregado
            setTimeout(async () => {
                await carregarConversaEspecifica(ultimaSessao);
            }, 500);
        }
    });
    </script>
</body>
</html>
