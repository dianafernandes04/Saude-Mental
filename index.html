<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Apoio à Saúde Mental</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
  --primary-color: #3C4B57;     /* Azul escuro */
  --secondary-color: #5B6C7A;   /* Azul médio */
  --bg-light: #D3D6D9;
  --container-light: #FFFFFF;
  --text-light: #3C4B57;
  --input-light: #F3F4F6;
  --border-light: #A7B9C5;
  --bot-msg-light: #A7B9C5;

  --bg-dark: #1A1E21;
  --container-dark: #2A2E31;
  --text-dark: #D3D6D9;
  --input-dark: #3C4B57;
  --border-dark: #5B6C7A;
  --bot-msg-dark: #2A2E31;
}


.button-auth,
#logout-btn,
.input-group button,
input,
.container,
.message {
  transition: all 0.3s ease;
}


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
      
    }
    h1, h2, h3 {
      font-family: 'Montserrat', sans-serif;
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 2rem;
      font-size: 1.8rem;
      font-weight: bold;
      position: relative;
    }

    #theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: 2px solid #fff;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    #theme-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #music-toggle {
      position: absolute;
      top: 20px;
      right: 70px; /* afasta do botão de tema */
      background: none;
      border: 2px solid #fff;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
      display: none; /* Escondido inicialmente */
    }

    #toggle-audio:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    
    .layout {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  justify-content: center;
  gap: 30px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}

.historico-lateral {
  width: 280px;
}

.conteudo-central {
  flex: 1;
  display: flex;
  justify-content: center;
  padding-top: 30px;
}

#chat-container {
  width: 100%;
  max-width: 500px;
}


    @media (max-width: 768px) {
      .layout {
        flex-direction: column;
        align-items: center;
      }

    .historico-lateral {
        width: 100%;
      }

    .conteudo-central {
        width: 100%;
      }
    }

    .container {
      background-color: var(--container-light);
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: background 0.3s ease;
    }

    body.dark .container {
      background-color: var(--container-dark);
    }

    h2 {
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-light);
      background-color: var(--input-light);
      color: var(--text-light);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    body.dark input {
      border: 1px solid var(--border-dark);
      background-color: var(--input-dark);
      color: var(--text-dark);
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(108, 99, 255, 0.3);
      outline: none;
    }

    .button-auth {
      width: 100%;
      background-color: #475866; /* tom base da paleta */
      color: white;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .button-auth:hover {
      background-color: #5B6C7A; /* tom hover mais claro */
    }

    #logout-btn {
      width: 100%;
      padding: 14px;
      background-color: #475866;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.3s ease;
      border: none;
    }

    #logout-btn:hover {
      background-color: #5B6C7A;
    }

    .input-group button {
      padding: 0 20px;
      height: 48px;
      background-color: #475866;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      border-radius: 12px;
      transition: background-color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
    }

    .input-group button:hover {
      background-color: #5B6C7A;
    }

    #nivel-depressao {
      text-align: center;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 15px;
    }

    #chatbox {
      height: 320px;
      overflow-y: auto;
      background-color: var(--input-light);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-light);
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    body.dark #chatbox {
      background-color: var(--input-dark);
      border: 1px solid var(--border-dark);
    }

    .message {
      padding: 10px 15px;
      margin: 6px 0;
      border-radius: 10px;
      max-width: 75%;
      word-wrap: break-word;
      font-size: 14px;
      display: inline-block;
      opacity: 0;
      transform: translateY(5px);
      animation: fadeIn 0.3s forwards;
    }

    .user-message {
      background-color: var(--primary-color);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    body.dark .user-message {
      color: white;
    }


    .bot-message {
      background-color: var(--bot-msg-light);
      color: var(--text-light);
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    body.dark .bot-message {
      background-color: var(--bot-msg-dark);
      color: var(--text-dark);
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
    }

    .typing-indicator div {
      width: 8px;
      height: 8px;
      background-color: #bbb;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing-indicator div:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator div:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    .input-group input {
      flex: 1;
      margin-bottom: 0;
    }

    .recommendations {
      margin-top: 30px;
      text-align: center;
    }

    .recommendations h2 {
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .card {
      background-color: var(--container-light);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      width: 260px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    body.dark .card {
      background-color: var(--container-dark);
      border: 1px solid var(--border-dark);
      color: var(--text-dark);
    }

    .icon-lg {
      width: 32px;
      height: 32px;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    @media (max-width: 500px) {
      .container { max-width: 95%; }
      header { font-size: 1.5rem; }
    }
  </style>
</head>

<body>
  <header>
    Sistema de Apoio à Saúde Mental
    <button id="music-toggle" onclick="alternarMusica()" style="display: none;">🔈</button>
    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
  </header>

  <main class="layout">

    <div class="historico-lateral" id="historico-container" style="display: none;">
      <h2>Histórico</h2>
      <ul id="lista-historico" style="list-style: none; padding: 0;"></ul>
    </div>
      
      <div class="conteudo-central">
        <div class="container" id="auth-container">
          <h2>Registar</h2>
          <form onsubmit="registar(event)">
            <input type="text" id="registar-primeiro-nome" placeholder="Primeiro nome" required>
            <input type="text" id="registar-username" placeholder="Nome de utilizador" required>
            <input type="password" id="registar-password" placeholder="Senha" required>
            <button class="button-auth" type="submit">Registar</button>
          </form>          
        <hr style="margin: 20px 0; border-color: #ddd;">
        <h2>Login</h2>
        <form onsubmit="login(event)">
          <input type="text" id="login-username" placeholder="Nome de utilizador" required>
          <input type="password" id="login-password" placeholder="Senha" required>
          <button class="button-auth" type="submit">Login</button>
        </form>
      </div>

      <div class="container" id="chat-container" style="display: none;">
        <div id="nivel-depressao" style="display: none;">Nível de Depressão: --</div>

        <div id="chatbox"></div>

        <button class="button-auth" onclick="novaConversa()" style="margin-bottom: 10px;">
          Nova Conversa <i data-lucide="plus" class="icon"></i>
        </button> 
        <form onsubmit="enviarMensagem(event)">
          <div class="input-group">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." required autocomplete="off">
            <button type="submit">
              Enviar <i data-lucide="send" class="icon"></i>
            </button>
          </div>
        </form>
        <button id="logout-btn" onclick="logout()">
          Logout <i data-lucide="log-out" class="icon"></i>
        </button>
      </div>
      
      <div class="recommendations" id="recommendations" style="display: none;">
        <h2>Recomendações Personalizadas</h2>
        <div class="cards" id="cards-container">
      </div>
    </div>
  </main>

  <script>
  lucide.createIcons();
  let token = '';
  let sessao_id = '';


  function toggleTheme() {
    const body = document.body;
    const btn = document.getElementById('theme-toggle');
    body.classList.toggle('dark');
    btn.innerHTML = body.classList.contains('dark') ? '☀️' : '🌙';
  }

  async function registar() {
    if (event) event.preventDefault();
    const primeiro_nome = document.getElementById('registar-primeiro-nome').value.trim();
    const username = document.getElementById('registar-username').value.trim();
    const password = document.getElementById('registar-password').value.trim();

    if (!primeiro_nome || !username || !password) {
      alert("Preencha todos os campos!");
      return;
    }

    // Validação da palavra-passe
    const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).+$/;
    if (!regex.test(password)) {
    alert("A palavra-passe deve conter pelo menos uma letra maiúscula, uma minúscula e um número.");
    return;
    }

    const res = await fetch('http://127.0.0.1:5000/api/registar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ primeiro_nome, username, password })
    });

    const data = await res.json();
    alert(data.mensagem);
}


async function login() {
  if(event) event.preventDefault();

  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value.trim();

  if (!username || !password) {
    alert("Preencha todos os campos!");
    return;
  }

  const res = await fetch('http://127.0.0.1:5000/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  alert(data.mensagem);

  if (res.ok) {
    token = data.token;
    sessao_id = data.sessao_id;

    document.getElementById('auth-container').style.display = 'none';
    document.getElementById('chat-container').style.display = 'block';
    document.getElementById('historico-container').style.display = 'block'; // <-- Aqui está!
    document.getElementById('music-toggle').style.display = 'inline-block';



    carregarHistorico();
  }

  document.getElementById('login-username').value = '';
  document.getElementById('login-password').value = '';
}

async function enviarMensagem(event) {
  event.preventDefault();
  const mensagemInput = document.getElementById('user-input');
  const mensagem = mensagemInput.value.trim();
  if (!mensagem) return;

  addMessage(mensagem, 'user-message');
  mensagemInput.value = '';
  mensagemInput.focus();

  const typing = mostrarIndicadorDigitando();

  try {
    const res = await fetch('http://127.0.0.1:5000/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mensagem, token, sessao_id })
    });

    const data = await res.json();
    typing.remove();

    await escreverMensagem(data.resposta, 'bot-message');
    atualizarNivelDepressao(data.nivel);

    // Recomendacoes personalizadas
    if (data.recomendacoes && data.recomendacoes.length > 0) {
      const cardsHTML = data.recomendacoes.map(rec => `
        <div class="card">
          <i data-lucide="${rec.icone}" class="icon-lg"></i>
          <p>${rec.texto}</p>
        </div>
      `).join('');
      document.getElementById('cards-container').innerHTML = cardsHTML;
      document.getElementById('recommendations').style.display = 'block';
    } else {
      document.getElementById('cards-container').innerHTML = '';
      document.getElementById('recommendations').style.display = 'none';
    }

    lucide.createIcons();

  } catch (error) {
    typing.remove();
    addMessage("Erro ao receber resposta.", 'bot-message');
  }
}

  
  async function carregarHistorico() {
  const res = await fetch('http://127.0.0.1:5000/api/historico', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token })
  });

  const data = await res.json();
  const lista = document.getElementById('lista-historico');
  lista.innerHTML = '';

  if (data.length === 0) {
    document.getElementById('historico-container').style.display = 'none';
    return;
  }

  document.getElementById('historico-container').style.display = 'block';

  data.forEach(conv => {
    const dataHora = new Date(conv.ultima_data).toLocaleString('pt-PT');
    const texto = conv.ultima_resposta.length > 60
      ? conv.ultima_resposta.slice(0, 60) + '...'
      : conv.ultima_resposta;

    const li = document.createElement('li');
    li.innerHTML = `
      <button class="button-auth" onclick="retomarConversa('${conv.sessao_id}')" style="width: 100%; text-align: left; margin-bottom: 10px;">
        <strong>${dataHora}</strong><br>
        <span style="font-size: 13px;">${texto}</span>
      </button>
    `;
    lista.appendChild(li);
  });
}

async function retomarConversa(id) {
  sessao_id = id;
  const res = await fetch(`http://127.0.0.1:5000/api/historico/${id}`);
  const data = await res.json();

  const chatbox = document.getElementById('chatbox');
  chatbox.innerHTML = '';

  data.forEach(par => {
    addMessage(par.mensagem, 'user-message');
    addMessage(par.resposta, 'bot-message');
  });
}


    function addMessage(text, type) {
      const chatbox = document.getElementById('chatbox');
      const message = document.createElement('div');
      message.classList.add('message', type);
      message.textContent = text;
      chatbox.appendChild(message);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function mostrarIndicadorDigitando() {
      const chatbox = document.getElementById('chatbox');
      const indicador = document.createElement('div');
      indicador.classList.add('typing-indicator');
      indicador.innerHTML = '<div></div><div></div><div></div>';
      chatbox.appendChild(indicador);
      chatbox.scrollTop = chatbox.scrollHeight;
      return indicador;
    }

    async function escreverMensagem(texto, type) {
      const chatbox = document.getElementById('chatbox');
      const message = document.createElement('div');
      message.classList.add('message', type);
      chatbox.appendChild(message);
      for (let i = 0; i < texto.length; i++) {
        message.textContent += texto[i];
        chatbox.scrollTop = chatbox.scrollHeight;
        await new Promise(resolve => setTimeout(resolve, 20));
      }
    }

    function atualizarNivelDepressao(nivel) {
  const nivelBox = document.getElementById('nivel-depressao');

  if (!nivel || nivel === "Desconhecido") {
    nivelBox.style.display = 'none';
    return;
  }

  nivelBox.style.display = 'block';
  nivelBox.innerHTML = `Nível de Depressão: <strong>${nivel}</strong>`;

  let cor = 'var(--primary-color)';
  if (nivel === 'Leve') cor = 'green';
  else if (nivel === 'Moderado') cor = 'orange';
  else if (nivel === 'Grave') cor = 'red';

  nivelBox.style.color = cor;
}

   
  // Só mostra as recomendações se houver conteúdo
  if (cardsHTML.trim()) {
    document.getElementById('recommendations').style.display = 'block';
  } else {
    document.getElementById('recommendations').style.display = 'none';
  }

  lucide.createIcons();

    function logout() {
      token = '';
      document.getElementById('chat-container').style.display = 'none';
      document.getElementById('auth-container').style.display = 'block';
      document.getElementById('chatbox').innerHTML = '';
      document.getElementById('recommendations').style.display = 'none';
      document.getElementById('nivel-depressao').style.display = 'none';
      document.getElementById('historico-container').style.display = 'none';
      document.getElementById('music-toggle').style.display = 'none';
      document.getElementById('relax-audio').pause();

      atualizarNivelDepressao('');
    }

    function novaConversa() {
      // Gerar novo sessao_id baseado na data
      const timestamp = new Date().toISOString().replace(/[-:.TZ]/g, '');
      sessao_id = `${token.split('.')[0]}_${timestamp}`; // ou usa o username se tiveres

      // Limpa chat
      const chatbox = document.getElementById('chatbox');
      chatbox.innerHTML = '';

      // Limpa recomendações e nível
      document.getElementById('recommendations').style.display = 'none';
      document.getElementById('cards-container').innerHTML = '';
      document.getElementById('nivel-depressao').textContent = 'Nível de Depressão: --';

      // Foco no input
      document.getElementById('user-input').focus();


      carregarHistorico();
    }

    function alternarMusica() {
      const audio = document.getElementById('relax-audio');
      const botao = document.getElementById('music-toggle');

      if (!audio || !botao) {
        console.error("Elemento de áudio ou botão não encontrado.");
        return;
      }

      if (audio.paused) {
        audio.play();
        botao.textContent = '🔊';
      } else {
        audio.pause();
        botao.textContent = '🔈';
      }
    }

  </script>
  <audio id="relax-audio" loop>
    <source src="/static/musica/relaxante.mp3" type="audio/mpeg">
    O seu navegador não suporta áudio.
  </audio>
</body>

</html>
